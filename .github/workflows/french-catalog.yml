name: Refresh offline French catalog
on:
  schedule:
    - cron: '23 9 3 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: french-catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Record activity before any source download/build can fail. The built-in
      # token can update this one marker without storing a personal access token.
      - name: Keep monthly updates active
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/keep_catalog_active.py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -p 'test_source_downloads.py'
      - run: python scripts/fetch_french_sources.py --refresh
      - run: python scripts/build_french_db.py --limit 10000
      - run: python -m unittest discover -s tests -p 'test_catalog_updates.py'
      - name: Publish validated data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="french-catalog-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/catalog_manifest.py --tag "$tag"
          gh release create "$tag" catalog.json inky_home/data/french.sqlite3 inky_home/data/SOURCES.md --target "$GITHUB_SHA" --title "Offline French catalog $(date -u +%Y-%m-%d)" --notes "Attributed Tatoeba, Kaikki and Lexique snapshot. Downloaded automatically by Inky Home; learning history stays on your Pi." --latest
